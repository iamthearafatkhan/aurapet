<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent !important;
            width: 100vw;
            height: 100vh;
            user-select: none;
            font-family: 'Segoe UI', sans-serif;
        }

        #pet-container {
            position: absolute;
            width: 180px;
            height: 180px;
            pointer-events: none;
            transform-origin: center center;
        }

        #speech-bubble {
            position: absolute;
            display: none;
            background: #343a40;
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            pointer-events: none;
            z-index: 999;
            max-width: 250px;
            text-align: center;
            transform: translate(-50%, -100%);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #343a40 transparent transparent transparent;
        }

        #chat-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #212529;
            flex-direction: column;
            color: #f8f9fa;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #2b3035;
            border-bottom: 1px solid #343a40;
            -webkit-app-region: drag;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #e9ecef;
        }

        .chat-controls {
            -webkit-app-region: no-drag;
        }

        .chat-controls button {
            background: transparent;
            color: #adb5bd;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .chat-controls button:hover {
            background: #343a40;
            color: white;
        }

        .chat-controls #chat-close:hover {
            background: #dc3545;
            color: white;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-msg {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
        }

        .chat-msg.user {
            background: #0d6efd;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-msg.pet {
            background: #343a40;
            color: #e9ecef;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-msg pre {
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            background: #1e1e1e;
            border: 1px solid #444;
            overflow-x: auto;
            color: #d4d4d4;
            font-family: 'Consolas', monospace;
        }

        .copy-btn {
            margin-top: 8px;
            background: #0d6efd;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #2b3035;
            border-top: 1px solid #343a40;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #495057;
            background: #212529;
            color: white;
            font-size: 14px;
            outline: none;
        }

        #chat-send {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #settings-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2d2d2d;
            padding: 20px;
            border-radius: 15px;
            z-index: 10001;
            color: white;
            width: 340px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #444;
        }

        #settings-modal input,
        #settings-modal select {
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
            background: #1e1e1e;
            color: white;
            margin-bottom: 10px;
        }

        .settings-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .settings-btns button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
    <script src="../node_modules/lottie-web/build/player/lottie.min.js"></script>
</head>

<body>
    <div id="pet-container">
        <div id="lottie-animation"></div>
    </div>
    <div id="speech-bubble"></div>

    <div id="chat-container">
        <div class="chat-header">
            <h3>Chat with Pet</h3>
            <div class="chat-controls">
                <button id="chat-file" title="Attach Image">📎</button>
                <button id="chat-settings" title="Settings">⚙️</button>
                <button id="chat-min" title="Minimize to Taskbar">—</button>
                <button id="chat-max" title="Fullscreen">⛶</button>
                <button id="chat-close" title="Hide Chat">✕</button>
            </div>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask anything..." />
            <button id="chat-send">Send</button>
        </div>
        <div
            style="text-align: center; padding: 10px; background: #1a1d21; font-size: 12px; color: #adb5bd; border-top: 1px solid #343a40;">
            Built by <a href="#" id="credit-link"
                style="color: #0d6efd; text-decoration: none; font-weight: bold;">Arafat Khan</a>
        </div>
    </div>

    <div id="settings-modal">
        <h2 style="margin-top:0;">⚙️ Settings</h2>
        <label>Your Name:</label><input type="text" id="set-user-name">
        <label>Pet Name:</label><input type="text" id="set-pet-name">
        <label>Brain Model:</label>
        <select id="set-model">
            <option value="hf.co/unlimitedpipe/decide-0.5b-GGUF:latest">Low (0.5B) — ~0.4 GB</option>
            <option value="qwen:latest">Mid (4B) — ~2.5 GB</option>
            <option value="deepseek-coder:6.7b">High (6.7B) — ~3.8 GB</option>
            <option value="llama3:8b">Max (8B) — ~4.7 GB</option>
            <option value="qwen:14b">Ultra (14B) — ~9.0 GB</option>
        </select>
        <button id="btn-download-model"
            style="width:100%; background:#0d6efd; color:white; border:none; border-radius:5px; cursor:pointer; padding:10px; margin-bottom:5px;">Download
            Model</button>
        <button id="btn-uninstall-model"
            style="width:100%; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer; padding:10px;">Uninstall
            Model</button>
        <div style="margin-top:10px; font-size:12px; color:#aaa;" id="download-status">Status: Ready</div>
        <div style="width:100%; background:#444; border-radius:5px; margin-top:5px; height:10px;">
            <div id="download-bar" style="width:0%; background:#0d6efd; height:100%; border-radius:5px;"></div>
        </div>
        <div class="settings-btns">
            <button id="btn-close-settings" style="background:#555; color:white;">Close</button>
            <button id="btn-save-settings" style="background:#198754; color:white;">Save</button>
        </div>
    </div>

    <script type="module" src="./pet.js"></script>
</body>

</html>
