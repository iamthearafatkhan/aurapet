<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent !important;
            width: 100vw;
            height: 100vh;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #pet-container {
            position: absolute;
            width: 180px;
            height: 180px;
            pointer-events: none;
            transform-origin: center center;
        }

        #speech-bubble {
            position: absolute;
            display: none;
            background: #343a40;
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            pointer-events: none;
            z-index: 999;
            max-width: 250px;
            text-align: center;
            transform: translate(-50%, -100%);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #343a40 transparent transparent transparent;
        }

        #name-box {
            position: absolute;
            display: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2d2d2d;
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            text-align: center;
            z-index: 10000;
            border: 1px solid #444;
        }

        #name-box input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #555;
            background: #1e1e1e;
            color: white;
            font-size: 16px;
        }

        #name-box button {
            padding: 10px 20px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* MODERN CHAT UI */
        #chat-container {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            width: 380px;
            height: 550px;
            background: #212529;
            border-radius: 16px;
            flex-direction: column;
            color: #f8f9fa;
            border: 1px solid #343a40;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        #chat-container.fullscreen {
            top: 0;
            right: 0;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #2b3035;
            border-bottom: 1px solid #343a40;
            border-radius: 16px 16px 0 0;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #e9ecef;
        }

        .chat-controls button {
            background: transparent;
            color: #adb5bd;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .chat-controls button:hover {
            background: #343a40;
            color: white;
        }

        .chat-controls #chat-close:hover {
            background: #dc3545;
            color: white;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #212529;
        }

        .chat-msg {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
        }

        .chat-msg.user {
            background: #0d6efd;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-msg.pet {
            background: #343a40;
            color: #e9ecef;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-msg pre {
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            background: #1e1e1e;
            border: 1px solid #444;
            overflow-x: auto;
            color: #d4d4d4;
            font-family: 'Consolas', monospace;
        }

        .copy-btn {
            margin-top: 8px;
            background: #0d6efd;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #2b3035;
            border-top: 1px solid #343a40;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #495057;
            background: #212529;
            color: white;
            font-size: 14px;
            outline: none;
        }

        #chat-send {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
    </style>
    <script src="../node_modules/lottie-web/build/player/lottie.min.js"></script>
</head>

<body>
    <div id="pet-container">
        <div id="lottie-animation"></div>
    </div>
    <div id="speech-bubble"></div>

    <div id="name-box">
        <h3>Name your pet:</h3>
        <input type="text" id="pet-name-input" placeholder="e.g. Jarvis" />
        <br />
        <button id="save-name-btn">Save</button>
    </div>

    <div id="chat-container">
        <div class="chat-header">
            <h3>Chat with Pet</h3>
            <div class="chat-controls">
                <button id="chat-mute" title="Mute/Unmute">🔊</button>
                <button id="chat-settings" title="Settings">⚙️</button>
                <button id="chat-min" title="Minimize">—</button>
                <button id="chat-max" title="Fullscreen">⛶</button>
                <button id="chat-close" title="Close">✕</button>
            </div>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask anything..." />
            <button id="chat-send">Send</button>
        </div>
        <div
            style="text-align: center; padding: 10px; background: #1a1d21; border-radius: 0 0 16px 16px; font-size: 12px; color: #adb5bd; border-top: 1px solid #343a40;">
            Built by <a href="#" id="credit-link"
                style="color: #0d6efd; text-decoration: none; font-weight: bold;">Arafat Khan</a>
        </div>
    </div>

    <div id="settings-modal"
        style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#2d2d2d; padding:20px; border-radius:15px; z-index:10001; color:white; width:400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #444;">
        <h2 style="margin-top:0;">⚙️ Brain & Settings</h2>
        <label style="display:block; margin-top:10px; font-size:14px;">Your Name:</label>
        <input type="text" id="set-user-name"
            style="width:90%; padding:8px; margin-top:5px; border-radius:5px; border:none; background:#1e1e1e; color:white;">
        <label style="display:block; margin-top:10px; font-size:14px;">Pet Name:</label>
        <input type="text" id="set-pet-name"
            style="width:90%; padding:8px; margin-top:5px; border-radius:5px; border:none; background:#1e1e1e; color:white;">
        <label style="display:block; margin-top:20px; font-size:14px; font-weight:bold;">Select Brain Model:</label>
        <select id="set-model"
            style="width:95%; padding:8px; margin-top:5px; border-radius:5px; border:none; background:#1e1e1e; color:white;">
            <option value="hf.co/unlimitedpipe/decide-0.5b-GGUF:latest">Low-End (0.5B) - Ultra Fast, 531MB</option>
            <option value="qwen:latest">Mid-End (4B) - Balanced Chat, 2.3GB</option>
            <option value="deepseek-coder:6.7b">High-End (6.7B) - Best for Coding, 3.8GB</option>
            <option value="llama3:8b">Max (8B) - Human-like Intelligence, 4.7GB</option>
            <option value="qwen:14b">Ultra (14B) - Deep Reasoning & Logic, 8.2GB</option>
        </select>
        <button id="btn-download-model"
            style="margin-top:10px; padding:10px; width:100%; background:#0d6efd; color:white; border:none; border-radius:5px; cursor:pointer;">Download
            / Install Model</button>
        <!-- Inside the Settings Modal, right below the Download button: -->

        <!-- ADD THIS NEW BUTTON -->
        <button id="btn-uninstall-model"
            style="margin-top:5px; padding:10px; width:100%; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer;">Uninstall
            Selected Model</button>
        <div style="margin-top:10px; font-size:12px; color:#aaa;" id="download-status">Status: Ready</div>
        <div style="width:100%; background:#444; border-radius:5px; margin-top:5px; height:10px;">
            <div id="download-bar"
                style="width:0%; background:#0d6efd; height:100%; border-radius:5px; transition: width 0.3s;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:20px;">
            <button id="btn-close-settings"
                style="padding:10px 20px; background:#555; color:white; border:none; border-radius:5px; cursor:pointer;">Close</button>
            <button id="btn-save-settings"
                style="padding:10px 20px; background:#198754; color:white; border:none; border-radius:5px; cursor:pointer;">Save
                Settings</button>
        </div>
    </div>
    <script type="module" src="./pet.js"></script>
</body>

</html>
